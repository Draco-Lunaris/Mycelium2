[package]
name = "mycelium-ui"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
serde.workspace = true
web-sys = { workspace = true, features = [
    "Clipboard",
    "HtmlDocument",
    "HtmlFormElement",
    "HtmlTextAreaElement",
    "Navigator",
    "Range",
    "Selection",
] }

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["ssr"]
# ssr enables leptos/islands: the #[island] macro's generated props
# (de)serialization code path uses leptos's islands-gated `serde`
# re-export (the PropsSerialized derive), so the server build must
# have the feature on to render island markup.
ssr = ["leptos/ssr", "leptos/islands"]
hydrate = ["leptos/hydrate", "leptos/islands"]
