[package]
name = "mycelium-web"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
mycelium-core = { path = "../mycelium-core" }
mycelium-store = { path = "../mycelium-store" }
mycelium-crypto = { path = "../mycelium-crypto" }
mycelium-auth = { path = "../mycelium-auth" }
mycelium-mcp = { path = "../mycelium-mcp" }
mycelium-librarian = { path = "../mycelium-librarian" }
mycelium-ui.workspace = true
axum.workspace = true
async-stream.workspace = true
axum-server.workspace = true
tower.workspace = true
tower-http.workspace = true
leptos.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
rcgen = "0.13"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2.2"
x509-parser = "0.16"
hex = "0.4"
# Sync bridge for the chat runner's Drop guard (async store calls from
# Drop) — the same crate mycelium-store pins for search_index.rs's
# `block_on` precedent.
futures-executor = "0.3"
# TLS upload fingerprinting (tls_admin::validate_upload). Already in the
# graph (rustls/jsonwebtoken/mycelium-auth); promoted to a direct dep.
sha2.workspace = true
# Cert validity math in validate_upload (expiry warnings). Already in the
# graph (yasna/asn1-rs/leptos); promoted to a direct dep. Features are
# declared explicitly rather than inherited: what this crate uses is
# `OffsetDateTime::now_utc` (feature "std"), `Duration::days`,
# `OffsetDateTime` subtraction and `Display` (all unconditional), so
# default-features off + "std" is the exact requirement — verified by
# building with nothing else's features unified in. A future transitive
# drop of time's default features cannot break this build.
time = { version = "0.3", default-features = false, features = ["std"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true
reqwest = { version = "0.12", features = ["json", "multipart"] }
md-5 = "0.10"
# Test-only: mint valid TOTP codes from an enrolled secret (the exact
# parameters mycelium-auth builds for verification) — mirrors
# mycelium-auth's own test helpers. Not a new dependency decision: the
# workspace already pins this exact spec for mycelium-auth.
totp-rs.workspace = true