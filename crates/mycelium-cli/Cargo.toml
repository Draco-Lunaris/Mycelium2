[package]
name = "mycelium-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "mycelium2-cli"
path = "src/main.rs"

[dependencies]
mycelium-core = { path = "../mycelium-core" }
mycelium-crypto = { path = "../mycelium-crypto" }
mycelium-store = { path = "../mycelium-store" }
clap = { version = "4.5", features = ["derive", "env"] }
tokio.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
sqlx.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Test harness mirrors the web skill-bundle integration tests: the
# packaged skills are seeded via the production seeder, and payload
# md5s are verified with the workspace idiom (md-5 + hex crates).
mycelium-web = { path = "../mycelium-web" }
md-5 = "0.10"
hex = "0.4"
