[workspace]
members = [
    "crates/mycelium-core",
    "crates/mycelium-crypto",
    "crates/mycelium-store",
    "crates/mycelium-auth",
    "crates/mycelium-web",
    "crates/mycelium-mcp",
    "crates/mycelium-librarian",
    "crates/mycelium-server",
    "crates/mycelium-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Draco-Lunaris"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Draco-Lunaris/Mycelium2"
rust-version = "1.88"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.43", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }

# HTTP / web
axum = { version = "0.8", features = ["macros"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
tower = { version = "0.5" }
tower-http = { version = "0.7", features = ["fs", "trace", "cors"] }
reqwest = { version = "0.13", features = ["json", "rustls"] }

# Serialization / config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
toml = "0.8"

# Storage
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "uuid", "chrono"] }

# Crypto
ring = "0.17"
argon2 = "0.6"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.10"

# Auth
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
totp-rs = { version = "6.0", features = ["otpauth", "gen_secret"] }
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }
openidconnect = { version = "4.0", features = ["reqwest"] }

# MCP
rmcp = { version = "3.2", features = ["server", "macros", "transport-streamable-http-server"] }

# Frontend
leptos = { version = "0.8" }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Errors / utilities
thiserror = "2.0"
anyhow = "1.0"
uuid = { version = "1.12", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.11"
walkdir = "2.5"

# Testing
tempfile = "3.16"

[profile.release]
opt-level = 3
lto = true
strip = true

[profile.dev]
opt-level = 0
